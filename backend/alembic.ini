[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

; Placeholder only — alembic/env.py overwrites this at runtime with the real
; DATABASE_URL from app/core/config.py, so editing this line has no effect.
sqlalchemy.url = postgresql://user:password@localhost:5432/devpulse

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
